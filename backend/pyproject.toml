[project]
name = "ladder-backend"
version = "0.1.0"
description = "Ladder Content OS — FastAPI backend"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-jose[cryptography]>=3.3.0",
  "supabase>=2.9.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "websockets>=13.1",
  "crewai>=0.95.0",
  "anthropic>=0.40.0",
  "openai>=1.54.0",
  "exa-py>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
