[project]
name = "ladder-research-agent"
version = "1.0.0"
description = "Unified Research Agent for Ladder — multi-platform demand/supply analysis with thesis generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.3.0",
    "langsmith>=0.2.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "tavily-python>=0.5.0",
    "exa-py>=1.5.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "hdbscan>=0.8.0",
    "redis>=5.0.0",
    "supabase>=2.10.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
